name: Daily WOTD

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: wotd-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore full-text cache
        uses: actions/cache@v4
        with:
          path: .cache/wotd/fulltext
          key: fulltext-${{ github.run_id }}
          restore-keys: |
            fulltext-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Caps every run, not just the first: anything past the cap is
          # skipped and the cursor still jumps to the newest entry, so keep
          # this above the biggest feed's daily output.
          WOTD_MAX_ARTICLES_PER_SOURCE: "25"
        run: wotd run

      - name: Commit & push
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "ai-wotd-bot"
            git config user.email "ai-wotd-bot@users.noreply.github.com"
            git add data/ docs/
            DATE=$(date -u +%Y-%m-%d)
            TODAY="data/wotd/${DATE}.json"
            if [[ -f "$TODAY" ]]; then
              WORD=$(jq -r '.word // "quiet day"' "$TODAY")
            else
              WORD="update"
            fi
            git commit -m "chore(wotd): ${DATE} — ${WORD}"
            git push origin HEAD
          else
            echo "No changes."
          fi

      # Runs after the push on purpose: the site still publishes, but a judge
      # that stopped answering turns the run red instead of degrading in silence.
      - name: Check the judge ran
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="data/wotd/${DATE}.json"
          if [[ ! -f "$FILE" ]]; then
            echo "No election for ${DATE}; nothing to check."
            exit 0
          fi
          STATUS=$(jq -r '.judge.status // "missing"' "$FILE")
          echo "judge status: ${STATUS}"
          if [[ "$STATUS" == "off" ]]; then
            echo "judge disabled by WOTD_JUDGE; not checking further."
            exit 0
          fi
          if [[ "$STATUS" != "ok" && "$STATUS" != "shadow" && "$STATUS" != "nothing_to_judge" ]]; then
            echo "::error::the TypeSafe judge did not run (status: ${STATUS}); the word fell back to the raw scorer"
            jq -r '.judge.error // empty' "$FILE"
            exit 1
          fi
